name: Build launcher exe

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "config.json"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        shell: bash
        run: |
          echo "{\"build\": ${{ github.run_number }}}" > build_info.json
          pyinstaller --noconfirm --clean --onedir --windowed --name LunoLauncher \
            --icon assets/icon.ico \
            --add-data "assets;assets" --add-data "config.json;." --add-data "build_info.json;." \
            --collect-all minecraft_launcher_lib --hidden-import PIL.ImageTk launcher.py
          cp config.json dist/LunoLauncher/config.json
          cp build_info.json dist/LunoLauncher/build_info.json

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/LunoLauncher -DestinationPath LunoLauncher.zip

      - name: Publish to release "launcher"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ github.run_number }}" > version.txt
          gh release view launcher >/dev/null 2>&1 || gh release create launcher --title "Launcher (auto build)" --notes "Automatic build of LunoLauncher.exe" --latest=false
          gh release upload launcher LunoLauncher.zip version.txt --clobber
